name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  matlab-tests:
    name: MATLAB smoke harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: >
            Control_System_Toolbox

      - name: Run test_gfm_design
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('scripts'); test_gfm_design

  markdown-links:
    name: Relative link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check relative markdown links
        run: python3 .github/scripts/check_links.py .
